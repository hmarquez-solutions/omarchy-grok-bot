; qmllint settings for CI. CI has no Quickshell and no Omarchy shell modules
; (Quickshell, Quickshell.Io, qs.Commons, qs.Ui), so every type, singleton and
; property that comes from them is unknown to qmllint. Only the categories
; those missing imports flood are turned off; everything else keeps qmllint's
; defaults and fails the job.
[General]
DisableDefaultImports=false
; Any remaining warning fails the run.
MaxWarnings=0

[Warnings]
; "Quickshell ... was not found", "Process/FileView/... was not found".
ImportFailure=disable
; Types from those modules (Process, FileView, StdioCollector, Panel, ...).
UnresolvedType=disable
; Root `Panel {` resolves to this directory's own Panel.qml when qs.Ui is
; missing, which reads as Panel -> Panel.
InheritanceCycle=disable
; Properties set on unresolved types (command, ipcTarget, anchorItem, ...).
MissingProperty=disable
; Style/Color singletons from qs.Commons and ids/properties reached through
; unresolved parents.
UnqualifiedAccess=disable
